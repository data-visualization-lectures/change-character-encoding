<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Shift JIS ⇄ UTF-8 文字コード変換ツール</title>

    <!-- 共通ヘッダ・認証 (Supabase) -->
    <script src="https://app.dataviz.jp/lib/supabase.js"></script>
    <script src="https://app.dataviz.jp/lib/dataviz-auth-client.js"></script>

    <!-- i18next -->
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.6/dist/umd/i18next.min.js"></script>

    <script src="https://unpkg.com/encoding-japanese@2.2.0/encoding.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: calc(48px + 24px) 24px 24px;
        }

        .container {
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 3px rgba(17, 24, 39, 0.08);
            max-width: 1000px;
            width: calc(100% - 40px);
            margin: 0 auto;
            overflow: hidden;
        }

        .header {
            background: #ffffff;
            color: #111827;
            padding: 32px 32px 24px;
            text-align: left;
            position: relative;
            border-bottom: 1px solid #e5e7eb;
        }

        .language-switcher {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            font-size: 13px;
        }

        .lang-link {
            color: #0f6cbd;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            cursor: pointer;
        }

        .lang-link.active {
            background: #eff6ff;
            border-color: #0f6cbd;
            color: #0958b5;
            font-weight: bold;
        }

        .lang-link:hover {
            background: #f3f4f6;
            border-color: #0f6cbd;
        }

        .header h1 {
            font-size: 1.75rem;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #6b7280;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
            min-height: 500px;
        }

        @media (max-width: 768px) {
            body {
                padding: calc(48px + 16px) 16px 16px;
            }

            .container {
                width: 100%;
            }

            .header {
                padding: 24px 20px;
                text-align: center;
            }

            .content {
                grid-template-columns: 1fr;
                min-height: auto;
                padding: 20px;
            }

            .language-switcher {
                position: static;
                justify-content: center;
                padding: 10px;
            }
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel h2 {
            font-size: 18px;
            color: #111827;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 10px;
        }

        textarea {
            flex: 1;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #0f6cbd;
            box-shadow: 0 0 0 3px rgba(15, 108, 189, 0.14);
        }

        #outputText {
            flex: 1;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            background: #f9fafb;
            overflow-y: auto;
            word-break: break-all;
            white-space: pre-wrap;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-height: 44px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .btn-primary {
            background: #0f6cbd;
            color: white;
            min-width: 100px;
        }

        .btn-primary:hover {
            filter: brightness(0.7);
        }

        .btn-primary:active {
            transform: none;
        }

        .btn-secondary {
            background: #ffffff;
            color: #111827;
            border: 1px solid #d1d5db;
            min-width: 100px;
        }

        .btn-secondary:hover {
            background: #f3f4f6;
            border-color: #0f6cbd;
        }

        .btn-secondary:active {
            transform: none;
        }

        .btn-success {
            background: #10b981;
            color: white;
            min-width: 100px;
        }

        .btn-success:hover {
            filter: brightness(0.7);
        }

        .btn-success:active {
            transform: translateY(0);
        }

        input[type="file"] {
            padding: 10px;
            border: 2px dashed #d1d5db;
            border-radius: 10px;
            cursor: pointer;
        }

        .info-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-left: 4px solid #0f6cbd;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            color: #374151;
        }

        .info-box strong {
            color: #0f6cbd;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #6b7280;
            flex-wrap: wrap;
        }

        .stat {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .stat strong {
            color: #0f6cbd;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 id="headerTitle">Shift JIS ⇄ UTF-8 文字コード変換ツール</h1>
            <p id="headerSubtitle">ブラウザ上で完全に動作します。プライベートで安全です。</p>
        </div>

        <div class="content">
            <!-- 入力パネル -->
            <div class="panel">
                <h2 id="inputLabel">📝 入力</h2>
                <div class="stats">
                    <div class="stat"><span id="charCountLabel">文字数</span>: <strong id="charCount">0</strong></div>
                    <div class="stat"><span id="byteCountLabel">バイト数</span>: <strong id="byteCount">0</strong></div>
                </div>
                <textarea id="inputText" placeholder="ここにテキストを入力またはファイルをアップロード..."></textarea>
                <input type="file" id="fileInput" accept=".txt, .csv, .json, .log">
            </div>

            <!-- 出力パネル -->
            <div class="panel">
                <h2 id="outputLabel">✅ 出力</h2>
                <div class="info-box">
                    <span id="encodingLabel">文字コードの変換</span>: <strong id="detectedEncoding">-</strong>
                </div>
                <div class="button-group">
                    <button class="btn-primary" id="downloadBtn">⬇️ <span id="downloadBtnLabel">ダウンロード</span></button>
                </div>
                <div id="outputText" placeholder="変換結果がここに表示されます"></div>
                <button class="btn-secondary" id="clearBtn">🔄 <span id="clearBtnLabel">クリア</span></button>
            </div>
        </div>
    </div>

    <script>
        // i18next 初期化
        i18next.init({
            lng: navigator.language.startsWith('ja') ? 'ja' : 'en',
            fallbackLng: 'en',
            resources: {
                ja: {
                    translation: {
                        pageTitle: 'Shift JIS ⇄ UTF-8 文字コード変換ツール',
                        headerTitle: 'Shift JIS ⇄ UTF-8 文字コード変換ツール',
                        headerSubtitle: 'ブラウザ上で完全に動作します。プライベートで安全です。',
                        inputLabel: '📝 入力',
                        outputLabel: '✅ 出力',
                        charCountLabel: '文字数',
                        byteCountLabel: 'バイト数',
                        encodingLabel: '文字コードの変換',
                        downloadBtnLabel: 'ダウンロード',
                        clearBtnLabel: 'クリア',
                        inputPlaceholder: 'ここにテキストを入力またはファイルをアップロード...',
                        outputPlaceholder: '変換結果がここに表示されます',
                        downloadErrorMessage: 'ダウンロードするデータがありません',
                        downloadErrorTitle: 'ダウンロードエラー',
                        conversionError: 'エラー',
                        fileReadError: 'ファイル読み込みエラー',
                        conversionErrorMessage: '変換エラー',
                        downloadErrorMessage2: 'ダウンロードエラー'
                    }
                },
                en: {
                    translation: {
                        pageTitle: 'Shift JIS ⇄ UTF-8 Character Code Converter',
                        headerTitle: 'Shift JIS ⇄ UTF-8 Character Code Converter',
                        headerSubtitle: 'Works completely in the browser. Safe and private.',
                        inputLabel: '📝 Input',
                        outputLabel: '✅ Output',
                        charCountLabel: 'Characters',
                        byteCountLabel: 'Bytes',
                        encodingLabel: 'Encoding Conversion',
                        downloadBtnLabel: 'Download',
                        clearBtnLabel: 'Clear',
                        inputPlaceholder: 'Enter text here or upload a file...',
                        outputPlaceholder: 'Conversion results will be displayed here',
                        downloadErrorMessage: 'No data to download',
                        downloadErrorTitle: 'Download Error',
                        conversionError: 'Error',
                        fileReadError: 'File Read Error',
                        conversionErrorMessage: 'Conversion Error',
                        downloadErrorMessage2: 'Download Error'
                    }
                }
            }
        });

        // Set HTML lang attribute
        document.documentElement.lang = i18next.language;

        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const fileInput = document.getElementById('fileInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const detectedEncodingEl = document.getElementById('detectedEncoding');
        const charCountEl = document.getElementById('charCount');
        const byteCountEl = document.getElementById('byteCount');

        let currentInputArray = null;
        let currentOutputArray = null;
        let currentDetectedEncoding = null;

        function initializeUI() {
            // ページタイトルの更新
            document.getElementById('pageTitle').textContent = i18next.t('pageTitle');
            document.getElementById('headerTitle').textContent = i18next.t('headerTitle');
            document.getElementById('headerSubtitle').textContent = i18next.t('headerSubtitle');

            // ラベルの更新
            document.getElementById('inputLabel').innerHTML = i18next.t('inputLabel');
            document.getElementById('outputLabel').innerHTML = i18next.t('outputLabel');
            document.getElementById('charCountLabel').textContent = i18next.t('charCountLabel');
            document.getElementById('byteCountLabel').textContent = i18next.t('byteCountLabel');
            document.getElementById('encodingLabel').textContent = i18next.t('encodingLabel');

            // ボタンラベルの更新
            document.getElementById('downloadBtn').innerHTML = '⬇️ <span id="downloadBtnLabel">' + i18next.t('downloadBtnLabel') + '</span>';
            document.getElementById('clearBtn').innerHTML = '🔄 <span id="clearBtnLabel">' + i18next.t('clearBtnLabel') + '</span>';

            // プレースホルダーの更新
            inputText.placeholder = i18next.t('inputPlaceholder');
            outputText.textContent = '';
        }

        // Initialize UI immediately
        initializeUI();

        // イベントリスナー
        inputText.addEventListener('input', convertText);
        fileInput.addEventListener('change', handleFileUpload);
        downloadBtn.addEventListener('click', downloadFile);
        clearBtn.addEventListener('click', clearAll);

        function convertText() {
            const text = inputText.value;

            if (text.length === 0) {
                outputText.textContent = '';
                detectedEncodingEl.textContent = '-';
                charCountEl.textContent = '0';
                byteCountEl.textContent = '0';
                currentInputArray = null;
                currentOutputArray = null;
                return;
            }

            try {
                const textBytes = new TextEncoder().encode(text);
                currentInputArray = Array.from(textBytes);

                currentOutputArray = Encoding.convert(currentInputArray, {
                    to: 'SJIS',
                    from: 'UTF8'
                });

                const outputUtf8 = Encoding.convert(currentOutputArray, {
                    to: 'UTF8',
                    from: 'SJIS'
                });
                const displayText = Encoding.convert(outputUtf8, {
                    to: 'UNICODE',
                    from: 'UTF8',
                    type: 'string'
                });
                outputText.textContent = displayText;

                detectedEncodingEl.textContent = 'UTF8 → SJIS';
            } catch (error) {
                outputText.textContent = `${i18next.t('conversionError')}: ${error.message}`;
                console.error(i18next.t('conversionErrorMessage'), error);
            }

            updateStats();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const arrayBuffer = e.target.result;
                    const uint8Array = new Uint8Array(arrayBuffer);
                    currentInputArray = Array.from(uint8Array);

                    const detected = Encoding.detect(currentInputArray);
                    let fromEncoding = detected || 'SJIS';
                    let targetEncoding = 'UTF8';

                    console.log('判別された文字コード:', detected);

                    if (fromEncoding === 'UTF8' || fromEncoding === 'UTF-8') {
                        targetEncoding = 'SJIS';
                        fromEncoding = 'UTF8';
                    } else {
                        targetEncoding = 'UTF8';
                        fromEncoding = 'SJIS';
                    }

                    const inputUtf8 = Encoding.convert(currentInputArray, {
                        to: 'UTF8',
                        from: fromEncoding
                    });
                    const inputDisplay = Encoding.convert(inputUtf8, {
                        to: 'UNICODE',
                        from: 'UTF8',
                        type: 'string'
                    });
                    inputText.value = inputDisplay;

                    currentOutputArray = Encoding.convert(currentInputArray, {
                        to: targetEncoding,
                        from: fromEncoding
                    });

                    const outputUtf8 = Encoding.convert(currentOutputArray, {
                        to: 'UTF8',
                        from: targetEncoding
                    });
                    const outputDisplay = Encoding.convert(outputUtf8, {
                        to: 'UNICODE',
                        from: 'UTF8',
                        type: 'string'
                    });
                    outputText.textContent = outputDisplay;

                    detectedEncodingEl.textContent = `${fromEncoding} → ${targetEncoding}`;
                    updateStats();
                    fileInput.value = '';
                } catch (error) {
                    outputText.textContent = `${i18next.t('fileReadError')}: ${error.message}`;
                    console.error(i18next.t('fileReadError'), error);
                    fileInput.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function updateStats() {
            const text = inputText.value;
            charCountEl.textContent = text.length;

            const utf8Bytes = new TextEncoder().encode(text);
            byteCountEl.textContent = utf8Bytes.length;
        }

        function downloadFile() {
            if (!currentOutputArray || currentOutputArray.length === 0) {
                alert(i18next.t('downloadErrorMessage'));
                return;
            }

            try {
                const uint8Array = new Uint8Array(currentOutputArray);
                const blob = new Blob([uint8Array], { type: 'text/plain' });

                const element = document.createElement('a');
                element.href = URL.createObjectURL(blob);
                element.download = `converted_${Date.now()}.csv`;
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
                URL.revokeObjectURL(element.href);
            } catch (error) {
                alert(`${i18next.t('downloadErrorTitle')}: ${error.message}`);
                console.error(i18next.t('downloadErrorMessage2'), error);
            }
        }

        function clearAll() {
            inputText.value = '';
            outputText.textContent = '';
            fileInput.value = '';
            detectedEncodingEl.textContent = '-';
            charCountEl.textContent = '0';
            byteCountEl.textContent = '0';
            currentInputArray = null;
            currentOutputArray = null;
            currentDetectedEncoding = null;
        }

        updateStats();
    </script>
</body>

</html>
